<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbisys — Bientôt disponible</title>
  <meta name="description" content="Le site Orbisys est en cours de construction. Revenez très bientôt." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    @keyframes orbit-spin { to { transform: rotate(360deg); } }
    .orbit-spin { animation: orbit-spin 14s linear infinite; transform-origin: 50% 50%; }
    .bar-fill { animation: bar 2.6s ease-in-out infinite; }
    @keyframes bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
  </style>
</head>
<body class="bg-bg text-ink antialiased">

  <!-- Sélecteur de langue -->
  <div class="absolute right-5 top-5 z-10 flex items-center gap-0.5 rounded-lg border border-border bg-bg p-0.5" role="group" aria-label="Langue / Language">
    <button type="button" data-lang-btn="fr" class="rounded px-2 py-1 text-xs font-semibold uppercase text-inkFaint">FR</button>
    <button type="button" data-lang-btn="en" class="rounded px-2 py-1 text-xs font-semibold uppercase text-inkFaint">EN</button>
  </div>

  <main class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden px-5 text-center">
    <!-- Halo décoratif -->
    <div class="pointer-events-none absolute left-1/2 top-1/3 h-[520px] w-[900px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-brand2/20 blur-[150px]"></div>

    <div class="relative">
      <!-- Logo animé -->
      <svg viewBox="0 0 100 100" class="mx-auto h-28 w-28">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
          <radialGradient id="gp" cx="0.4" cy="0.35" r="0.85"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#0B1230"/></radialGradient>
        </defs>
        <g class="orbit-spin">
          <ellipse cx="50" cy="50" rx="43" ry="16" fill="none" stroke="url(#g)" stroke-width="4" transform="rotate(-27 50 50)" opacity="0.85"/>
          <ellipse cx="50" cy="50" rx="43" ry="16" fill="none" stroke="url(#g)" stroke-width="4" transform="rotate(32 50 50)"/>
          <circle cx="83" cy="34" r="6.5" fill="url(#g)"/>
          <circle cx="20" cy="63" r="6" fill="url(#g)"/>
          <circle cx="80" cy="66" r="5.5" fill="url(#g)"/>
        </g>
        <circle cx="50" cy="50" r="21" fill="url(#gp)" stroke="url(#g)" stroke-width="1.5"/>
      </svg>

      <div class="mt-6 flex items-center justify-center gap-2.5">
        <span class="text-2xl font-extrabold tracking-tight">Orbisys</span>
      </div>
      <p class="mt-1 text-[11px] uppercase tracking-[0.22em] text-inkFaint" data-i18n="tagline">Surveillez. Comprenez. Agissez.</p>

      <span class="mt-8 inline-flex items-center gap-2 rounded-full border border-border bg-bgSoft px-4 py-1.5 text-xs font-medium text-inkSoft">
        <span class="h-2 w-2 rounded-full bg-warn"></span>
        <span data-i18n="badge">Site en cours de construction</span>
      </span>

      <h1 class="mt-6 text-4xl font-black leading-tight tracking-tight sm:text-5xl" data-i18n="title" data-i18n-html>
        Bientôt <span class="gradient-text">disponible</span>.
      </h1>
      <p class="mx-auto mt-4 max-w-md text-inkSoft" data-i18n="subtitle">
        Nous préparons quelque chose de bien. Notre site vitrine arrive très prochainement — merci de votre patience.
      </p>

      <!-- Barre de progression indéterminée -->
      <div class="mx-auto mt-8 h-1.5 w-64 overflow-hidden rounded-full bg-bgSoft">
        <div class="bar-fill h-full w-1/4 rounded-full bg-gradient-to-r from-sky to-brand2"></div>
      </div>

      <div class="mt-9 flex flex-col items-center justify-center gap-3 sm:flex-row">
        <a href="https://github.com/zero97436/MVP" class="rounded-xl border border-border bg-bgSoft px-6 py-3 text-sm font-semibold text-ink hover:border-inkFaint">GitHub</a>
        <a href="mailto:contact@orbisys.io" class="rounded-xl bg-gradient-to-r from-sky to-brand2 px-6 py-3 text-sm font-semibold text-white" data-i18n="contact">Nous contacter</a>
      </div>

      <p class="mt-10 text-xs text-inkFaint" data-i18n="footer">© 2026 Orbisys — Tous droits réservés.</p>
    </div>
  </main>

  <script>
    (function () {
      var KEY = "orbisys_site_lang";
      var DICT = {
        "meta.title": { fr: "Orbisys — Bientôt disponible", en: "Orbisys — Coming soon" },
        "tagline": { fr: "Surveillez. Comprenez. Agissez.", en: "Monitor. Understand. Act." },
        "badge": { fr: "Site en cours de construction", en: "Site under construction" },
        "title": { fr: 'Bientôt <span class="gradient-text">disponible</span>.', en: 'Coming <span class="gradient-text">soon</span>.' },
        "subtitle": {
          fr: "Nous préparons quelque chose de bien. Notre site vitrine arrive très prochainement — merci de votre patience.",
          en: "We're building something great. Our website is launching very soon — thanks for your patience.",
        },
        "contact": { fr: "Nous contacter", en: "Contact us" },
        "footer": { fr: "© 2026 Orbisys — Tous droits réservés.", en: "© 2026 Orbisys — All rights reserved." },
      };
      function resolveLang() {
        try { var s = localStorage.getItem(KEY); if (s === "fr" || s === "en") return s; } catch (e) {}
        return (navigator.language || "fr").toLowerCase().indexOf("en") === 0 ? "en" : "fr";
      }
      function apply(lang) {
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var e = DICT[el.getAttribute("data-i18n")]; if (!e) return;
          var v = e[lang] != null ? e[lang] : e.fr;
          if (el.hasAttribute("data-i18n-html")) el.innerHTML = v; else el.textContent = v;
        });
        if (DICT["meta.title"]) document.title = DICT["meta.title"][lang] || DICT["meta.title"].fr;
        document.querySelectorAll("[data-lang-btn]").forEach(function (b) {
          var on = b.getAttribute("data-lang-btn") === lang;
          b.classList.toggle("bg-brand", on); b.classList.toggle("text-white", on); b.classList.toggle("text-inkFaint", !on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("[data-lang-btn]").forEach(function (b) {
          b.addEventListener("click", function () { try { localStorage.setItem(KEY, b.getAttribute("data-lang-btn")); } catch (e) {} apply(b.getAttribute("data-lang-btn")); });
        });
        apply(resolveLang());
      });
    })();
  </script>
</body>
</html>
